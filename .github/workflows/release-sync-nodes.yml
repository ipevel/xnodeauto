name: Build & Release sync-nodes

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build amd64
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags "-s -w" -o sync-nodes-linux-amd64 ./cmd/sync-nodes

      - name: Build arm64
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -trimpath -ldflags "-s -w" -o sync-nodes-linux-arm64 ./cmd/sync-nodes

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sync-nodes-linux-amd64
            sync-nodes-linux-arm64
          generate_release_notes: true
